# Q2 — Frequency ceiling
# ──────────────────────────────────────────────────────────────────────────────
# Research question: What is the cost of TabPFN's 10,000-sample ceiling for
# frequency modelling?
#
# GLM and XGBoost run on the full training fold (no subsampling).
# TabPFN runs at each subsample size listed below; results are nested
# (2k ⊂ 5k ⊂ 10k — same random draw, first N rows taken).
#
# Output: Figure 1 — Poisson deviance vs. subsample size for French and Belgian
#         MTPL frequency; GLM and XGBoost as horizontal reference lines.

experiment_id: experiment_q2_frequency
task: freq
cv_seed: 42
cv_folds: 5

datasets:
  - freMTPL2
  - beMTPL97

models:
  - glm
  - xgboost
  - tabpfn

tabpfn:
  # Subsample sizes to evaluate. The script draws max(numeric sizes) rows
  # per fold (seed = cv_seed + fold_index) and uses the first N for each size.
  # The "full" sentinel triggers an additional fit on the entire training
  # fold (no subsampling) — used to exercise v3's expanded context size.
  # v2.5 and v2.6 have fixed pretraining ceilings (50k and 100k rows
  # respectively): the script automatically skips them whenever the subsample
  # exceeds their supported limit (e.g. on the "full" pass for freMTPL2 /
  # beMTPL97), so only v3 produces a "full" data point.
  subsample_sizes: [2000, 5000, 10000, 50000, 100000, "full"]
  # Internal ModelVersions to dispatch through create_default_for_version.
  # Each version is fitted on the same subsample so per-version timing /
  # deviance is directly comparable.  Accepted values: "v2_5", "v2_6", "v3".
  tabpfn_versions: ["v2_6", "v3"]
